name: StreamHub
options:
  bundleIdPrefix: com.streamhub
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  StreamHub:
    type: application
    platform: iOS
    sources:
      - path: StreamHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamhub.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StreamHub
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
