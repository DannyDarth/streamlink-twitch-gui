name: Test critical dependency remediation

on:
  workflow_dispatch:
  push:
    branches:
      - security/windows-critical-dependency-audit
    paths:
      - .github/workflows/windows-critical-dependency-test.yml
      - package.json
      - yarn.lock

permissions:
  contents: write

jobs:
  test-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Identify dependency chains
        run: |
          yarn why handlebars
          yarn why babel-traverse
      - name: Try patched Handlebars in isolated checkout
        run: |
          yarn upgrade handlebars@4.7.10 --ignore-scripts --non-interactive
          yarn list --pattern handlebars
          yarn audit --json --level low > audit-after.jsonl || true
      - name: Test application compilation
        run: yarn run grunt clean:tmp_prod webpack:prod
      - name: Test application behavior
        run: xvfb-run --auto-servernum yarn run grunt test:coverage
      - name: Commit verified Handlebars dependency files to security branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/windows-critical-dependency-audit'
        run: |
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            echo "Handlebars dependency files already match the tested candidate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Handlebars to tested patched version"
          git push origin HEAD:security/windows-critical-dependency-audit
      - name: Save candidate lockfile and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-critical-dependency-candidate
          path: |
            yarn.lock
            audit-after.jsonl
          retention-days: 14
