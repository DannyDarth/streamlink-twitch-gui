name: Test critical dependency remediation

on:
  workflow_dispatch:
  push:
    branches:
      - security/windows-critical-dependency-audit
    paths:
      - .github/workflows/windows-critical-dependency-test.yml
      - package.json
      - yarn.lock

permissions:
  contents: read

jobs:
  test-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Inventory inject-loader usage and replacement requirements
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const matches = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile() && /\\.js$/.test(p)) {
                const source = fs.readFileSync(p, 'utf8');
                for (const m of source.matchAll(/inject-loader(?:\\?[^!'"\\s]*)?!([^'"\\s]+)/g)) {
                  matches.push({file:p, import:m[0], query:m[0].split('!')[0]});
                }
              }
            }
          }
          walk('src/test');
          const report = {count:matches.length, files:new Set(matches.map(m=>m.file)).size, imports:matches};
          fs.writeFileSync('inject-loader-usage.json', JSON.stringify(report, null, 2));
          console.log('inject-loader imports:', report.count, 'across files:', report.files);
          console.log('Examples:', JSON.stringify(matches.slice(0,15),null,2));
          NODE
      - name: Check dependency chain without removing test functionality
        run: |
          yarn why inject-loader
          yarn why babel-traverse
          yarn list --pattern 'inject-loader|babel-traverse|babel-core' > babel-dependency-tree.txt || true
      - name: Resolve permanent Handlebars override
        run: |
          yarn install --ignore-scripts --non-interactive
          yarn list --pattern handlebars
          node - <<'NODE'
          const fs = require('fs');
          const lock = fs.readFileSync('yarn.lock', 'utf8');
          if (/handlebars@[^:]*:\n  version "4\.7\.9"/.test(lock)) {
            throw new Error('Vulnerable Handlebars 4.7.9 remains in candidate lockfile');
          }
          console.log('Verified no Handlebars 4.7.9 lockfile entries');
          NODE
      - name: Identify remaining vulnerable dependency chains
        run: |
          yarn why handlebars
          yarn why babel-traverse
          yarn list --pattern 'handlebars|babel-traverse'
      - name: Audit locked dependency tree
        run: |
          yarn audit --json --level low > audit-after.jsonl || true
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('audit-after.jsonl', 'utf8').split(/\r?\n/);
          const findings = [];
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const item = JSON.parse(line);
              if (item.type === 'auditAdvisory') {
                const a = item.data.advisory;
                findings.push({module: a.module_name, severity: a.severity, title: a.title, vulnerable_versions: a.vulnerable_versions, patched_versions: a.patched_versions, paths: item.data.resolution?.path || null});
              }
            } catch (e) { console.log('Skipped non-JSON audit output:', e.message); }
          }
          const critical = findings.filter(f => f.severity === 'critical');
          fs.writeFileSync('critical-dependency-report.json', JSON.stringify({total_advisories: findings.length, critical}, null, 2));
          console.log('Total advisories:', findings.length);
          console.log('Critical advisories:', critical.length);
          console.log(JSON.stringify(critical, null, 2));
          NODE
      - name: Test application compilation
        run: yarn run grunt clean:tmp_prod webpack:prod
      - name: Test application behavior
        run: xvfb-run --auto-servernum yarn run grunt test:coverage
      - name: Save candidate lockfile and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-critical-dependency-candidate
          path: |
            yarn.lock
            package.json
            audit-after.jsonl
            critical-dependency-report.json
            babel-dependency-tree.txt
            inject-loader-usage.json
          retention-days: 14
